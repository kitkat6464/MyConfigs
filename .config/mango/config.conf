# More option see https://github.com/DreamMaoMao/mango/wiki/

# env Configuration
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# Start Noctalia and XDG Stuff
exec_once=noctalia
exec_once=xdg-user-dirs-update
exec_once=xdg-desktop-portal-wlr

# Auto Reload Config
auto_reload_config=1

# Blur Configuration
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes=4
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=1.0
blur_params_contrast=1.4
blur_params_saturation=1.4

# Shadow Configuration
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff

# Window Appearance Configuration
border_radius=16
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.8

# Dim Configuration
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Configuration
scroller_structs=40
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_ignore_proportion_single=0

# Master-Stack Configuration
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=6
smart_gaps=0

# Dwindle Configuration
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Configuration
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Configuration
deck_tab_mode=1

# Overview Configuration
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc Configuration
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard Configuration
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=gb

# Trackpad Configuration
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse Configuration
mouse_natural_scrolling=0
cursor_hide_on_keypress=1

# Appearance Configuration
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2

# Key Bindings Configuration

# Favorite Application Bindings
bind=SUPER,Return,spawn,kitty
bind=SUPER,f,spawn,nautilus
bind=SUPER,b,spawn,firefox

# Noctalia Core Bindings
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,a,spawn,noctalia msg settings-toggle
bind=SUPER,t,spawn,noctalia msg panel-toggle control-center
bind=SUPER,c,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper

# Noctalia Extra Bindings
bind=SUPER+ALT,q,spawn,noctalia msg session logout
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER+ALT,r,spawn,noctalia msg session reboot
bind=SUPER+ALT,h,spawn,noctalia msg session shutdown
bind=ALT,Tab,spawn,noctalia msg window-switcher

# Noctalia Screenshot Bindings
bind=SUPER,s,spawn,noctalia msg screenshot-region
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-fullscreen
bind=SUPER+ALT,s,spawn,noctalia msg screenshot-annotate

# Noctalia Media and Volume Bindings
bind=SUPER,9,spawn,noctalia msg media next
bind=SUPER,8,spawn,noctalia msg media toggle
bind=SUPER,7,spawn,noctalia msg media previous
bind=SUPER,3,spawn,noctalia msg volume-up 10
bind=SUPER,2,spawn,noctalia msg volume-mute
bind=SUPER,1,spawn,noctalia msg volume-down 10

# Noctalia Emergency Start Binding (Used If Noctalia Shell Crashes)
bind=SUPER+ALT,0,spawn,noctalia

# Exit Bindings
bind=SUPER,m,quit
bind=ALT,q,killclient,

# Switch Window Focus Bindings
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# Move Window Bindings
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# Switch Window State Bindings
bind=SUPER,g,toggleglobal,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# Scroller Bindings
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Dwindle Bindings
bind=alt+shift,Return,dwindle_toggle_split_direction

# Switch Layout Bindings
bind=SUPER,n,switch_layout

# Tag Switch Bindings
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0

# Tag Move Bindings
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0

# Monitor Switch Bindings
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# Windows Gap Bindings
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Move Window Bindings
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Resize Window Bindings
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Monitor Settings
monitor_rule=name:DP-2,rr:0,scale:1.0,x:0,y:0,width:1920,height:1080,refresh:180.003,vrr:1,hdr:0

# Layout Rules
tag_rule=id:1,layout_name:monocle
tag_rule=id:2,layout_name:monocle
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller

## WINDOW RULES

window_rule=is_floating:1,app_id:kitty

window_rule=is_floating:1,app_id:org.gnome.Nautilus

window_rule=tags:1,app_id:^spotify$

window_rule=tags:2,app_id:^steam$

window_rule=tags:3,app_id:^firefox$
window_rule=is_floating:1,app_id:^firefox$.*,title:^Library$

window_rule=tags:3,is_fullscreen:1,vrr_only_fullscreen:1,force_render:1,app_id:^gamescope$
window_rule=tags:3,is_fullscreen:1,vrr_only_fullscreen:1,force_render:1,app_id:^broken$
window_rule=tags:3,is_fullscreen:1,vrr_only_fullscreen:1,force_render:1,app_id:^steam_app.*$

window_rule=offset_y:96%,offset_x:98%,no_border:1,is_open_silent:1,is_overlay:1,is_floating:1,width:440,height:220,title:Picture-in-Picture
window_rule=offset_y:96%,offset_x:98%,no_border:1,is_open_silent:1,is_overlay:1,is_floating:1,width:440,height:220,title:Picture in picture

source=~/.config/mango/noctalia.conf

