[notification]
background_opacity = 0.4999999888241291

[osd]
background_opacity = 0.4999999888241291

[plugins]
auto_update = "official"

[shell]
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = false
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    categories = false
    sort_by_usage = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    clipboard_placement = "attached"
    list_item_background = true
    polkit_placement = "attached"
    session_position = "center"
    shadow = false
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Rosé Pine"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "sway",
        "umbriel",
        "wezterm"
    ]
    community_ids = [ "pywalfox-beta4" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/catrina/Pictures/Wallpapers/wallhaven-jew2dq_1920x1080.png"

    [wallpaper.last]
    path = "/home/catrina/Pictures/Wallpapers/wallhaven-jew2dq_1920x1080.png"

    [wallpaper.monitors.DP-2]
    path = "/home/catrina/Pictures/Wallpapers/wallhaven-jew2dq_1920x1080.png"

[widget.active_window]
display = "text_only"
title_scroll = "on_hover"

[widget.audio_visualizer]
show_when_idle = true

[widget.cpu-mon]
type = "sysmon"
visualization = "none"

[widget.cpu-temp]
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.gpu-mon]
stat = "gpu_usage"
type = "sysmon"
visualization = "none"

[widget.gpu-temp]
stat = "gpu_temp"
type = "sysmon"
visualization = "none"

[widget.media]
artist_first = true
show_progress = true
title_scroll = "on_hover"

[widget.ram-used]
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.vram-used]
stat = "gpu_vram_used"
type = "sysmon"
visualization = "none"

[widget.weather]
show_condition = false