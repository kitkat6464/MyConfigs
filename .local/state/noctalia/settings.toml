[bar.default]
background_opacity = 0.04999999888241291
capsule = true
center = [ "media", "clock", "audio_visualizer" ]
end = [ "group:g1", "group:g2", "tray", "volume", "notifications", "control-center" ]
radius = 16
shadow = false
start = [ "privacy", "workspaces", "active_window" ]
widget_spacing = 8

    [bar.default.dead_zone.actions]
    back = "none"
    forward = "none"
    left = "none"
    middle = "none"
    right = "none"
    scroll_down = "none"
    scroll_left = "none"
    scroll_right = "none"
    scroll_up = "none"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu-mon", "cpu-temp", "ram-used" ]
    opacity = 0.75
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "gpu-mon", "gpu-temp", "vram-used" ]
    opacity = 0.75
    padding = 6.0

